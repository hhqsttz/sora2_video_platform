<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sora2 视频生成平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --input-bg: #0f172a;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            letter-spacing: -0.02em;
            text-shadow: 0 0 40px rgba(99, 102, 241, 0.3);
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 40px;
            align-items: start;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 24px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .form-row .input-group {
            flex: 1;
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        textarea, input[type="text"], input[type="password"], select, input[type="number"] {
            width: 100%;
            padding: 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-color);
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        
        input::placeholder, textarea::placeholder {
            color: #475569;
        }

        textarea:focus, input:focus, select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
            line-height: 1.6;
        }

        .file-upload {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            background-color: var(--input-bg);
            transition: all 0.2s;
            cursor: pointer;
            text-align: center;
        }
        
        .file-upload:hover {
            border-color: var(--primary-color);
            background-color: rgba(99, 102, 241, 0.05);
        }
        
        .file-upload input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }
        
        .file-upload-content {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        button#submitBtn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
            position: relative;
            overflow: hidden;
        }

        button#submitBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.5);
        }
        
        button#submitBtn:active {
            transform: translateY(0);
        }

        button#submitBtn:disabled {
            background: #334155;
            color: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .task-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        .task-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .task-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.5);
            border-color: var(--primary-color);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .task-id {
            font-family: monospace;
            color: var(--text-secondary);
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .status-pending { background: rgba(148, 163, 184, 0.2); color: #cbd5e1; }
        .status-running { background: rgba(59, 130, 246, 0.2); color: #60a5fa; animation: pulse 2s infinite; }
        .status-done { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .status-failed { background: rgba(239, 68, 68, 0.2); color: #f87171; }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .progress-container {
            margin-top: 15px;
        }

        .progress-bar {
            height: 8px;
            background: #334155;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-color), #ec4899);
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }

        .video-preview {
            margin-top: 15px;
            width: 100%;
            border-radius: 12px;
            background: #000;
            aspect-ratio: 16/9;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .download-btn {
            display: block;
            text-align: center;
            margin-top: 15px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            text-decoration: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        
        .download-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        .prompt-text {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .task-meta {
            display: flex;
            gap: 15px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .meta-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sora2 Studio</h1>
            <div class="subtitle">Next Generation Video Generation Platform</div>
        </header>
        
        <div class="main-grid">
            <!-- Sidebar / Control Panel -->
            <div class="card">
                <div class="section-title">⚙️ 配置</div>
                
                <div class="input-group">
                    <label for="apiKey">API Key</label>
                    <input type="password" id="apiKey" placeholder="sk-proj-..." />
                </div>
                
                <div class="section-title" style="margin-top: 30px;">🎨 参数</div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="model">模型</label>
                        <select id="model">
                            <option value="sora-2-pro">Sora 2 Pro</option>
                            <option value="sora-2">Sora 2</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="duration">时长</label>
                        <select id="duration">
                            <option value="5">5 秒</option>
                            <option value="10">10 秒</option>
                            <option value="15">15 秒</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="input-group">
                        <label for="size">画质</label>
                        <select id="size">
                            <option value="large">1080p 高清</option>
                            <option value="medium">720p 标准</option>
                            <option value="small">480p 流畅</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label for="orientation">比例</label>
                        <select id="orientation">
                            <option value="landscape">16:9 横屏</option>
                            <option value="portrait">9:16 竖屏</option>
                            <option value="square">1:1 方形</option>
                        </select>
                    </div>
                </div>
                
                <div class="input-group">
                    <label>参考图 (可选)</label>
                    <div class="file-upload" onclick="document.getElementById('imageInput').click()">
                        <input type="file" id="imageInput" accept="image/*" onchange="updateFileName(this)">
                        <div class="file-upload-content" id="fileLabel">
                            <span style="font-size: 1.5rem; display: block; margin-bottom: 5px;">🖼️</span>
                            点击上传图片
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="prompt">创意描述</label>
                    <textarea id="prompt" placeholder="描述你想生成的梦境... 例如：赛博朋克风格的雨夜街道，霓虹灯闪烁，一只机械猫在屋顶漫步"></textarea>
                </div>

                <button id="submitBtn" onclick="createTask()">✨ 开始生成</button>
            </div>

            <!-- Main Content / Gallery -->
            <div>
                <div class="section-title">📽️ 作品库</div>
                <div id="taskList" class="task-grid">
                    <!-- Tasks will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "http://localhost:8000";

        function updateFileName(input) {
            const label = document.getElementById('fileLabel');
            if (input.files && input.files[0]) {
                label.innerHTML = `<span style="color: #4ade80">✓ ${input.files[0].name}</span>`;
            } else {
                label.innerHTML = '<span style="font-size: 1.5rem; display: block; margin-bottom: 5px;">🖼️</span>点击上传图片';
            }
        }

        // 从 localStorage 加载 API Key
        document.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('sora_api_key');
            if (savedKey) {
                document.getElementById('apiKey').value = savedKey;
            }
        });

        async function createTask() {
            const promptInput = document.getElementById("prompt");
            const apiKeyInput = document.getElementById("apiKey");
            const durationInput = document.getElementById("duration");
            const modelInput = document.getElementById("model");
            const sizeInput = document.getElementById("size");
            const orientationInput = document.getElementById("orientation");
            const imageInput = document.getElementById("imageInput");
            const submitBtn = document.getElementById("submitBtn");
            
            const prompt = promptInput.value.trim();
            const apiKey = apiKeyInput.value.trim();
            const duration = parseInt(durationInput.value);
            const model = modelInput.value;
            const size = sizeInput.value;
            const orientation = orientationInput.value;

            if (!prompt) {
                alert("请填写创意描述！");
                return;
            }

            if (!apiKey) {
                alert("请输入 API Key！");
                return;
            }

            // 保存 API Key 到本地
            if (apiKey) {
                localStorage.setItem('sora_api_key', apiKey);
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="status-running">🚀</span> 正在提交...';

            try {
                let imageBase64 = null;
                if (imageInput.files.length > 0) {
                    const file = imageInput.files[0];
                    if (file.size > 10 * 1024 * 1024) { // 10MB
                        alert("图片大小不能超过 10MB");
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '✨ 开始生成';
                        return;
                    }

                    // 如果图片大于 2MB，进行压缩
                    if (file.size > 2 * 1024 * 1024) {
                        submitBtn.innerHTML = '🔄 正在处理图片...';
                        imageBase64 = await compressImage(file);
                    } else {
                        // 直接读取
                        imageBase64 = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = () => resolve(reader.result);
                            reader.onerror = error => reject(error);
                            reader.readAsDataURL(file);
                        });
                    }
                    submitBtn.innerHTML = '🚀 正在提交...';
                }

                const res = await fetch(`${API_BASE}/tasks`, {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        prompt: prompt,
                        api_key: apiKey || null,
                        duration: duration,
                        model: model,
                        size: size,
                        orientation: orientation,
                        image: imageBase64
                    })
                });
                
                if (res.ok) {
                    promptInput.value = "";
                    imageInput.value = ""; // 清空文件选择
                    updateFileName(imageInput); // 重置显示
                    refresh(); // 立即刷新列表
                } else {
                    const err = await res.json();
                    alert("提交失败: " + (err.detail || "未知错误"));
                }
            } catch (e) {
                console.error(e);
                alert("网络错误: " + e.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '✨ 开始生成';
            }
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        const MAX_SIZE = 2048;

                        if (width > MAX_SIZE || height > MAX_SIZE) {
                            if (width > height) {
                                height *= MAX_SIZE / width;
                                width = MAX_SIZE;
                            } else {
                                width *= MAX_SIZE / height;
                                height = MAX_SIZE;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        // 压缩为 JPEG，质量 0.8
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        resolve(dataUrl);
                    };
                    img.onerror = (err) => reject(err);
                };
                reader.onerror = (err) => reject(err);
            });
        }

        async function refresh() {
            try {
                const res = await fetch(`${API_BASE}/tasks`);
                const tasks = await res.json();
                renderTasks(tasks);
            } catch (e) {
                console.error("刷新任务失败:", e);
            }
        }

        function renderTasks(tasks) {
            const container = document.getElementById("taskList");
            const sortedTasks = [...tasks].reverse();
            
            container.innerHTML = sortedTasks.map(task => {
                let statusClass = `status-${task.status}`;
                let mediaContent = '';
                let statusText = task.status;
                
                if (task.status === 'done' && task.result_path) {
                    const filename = task.result_path.split(/[/\\]/).pop();
                    const videoUrl = `${API_BASE}/outputs/${filename}`;
                    mediaContent = `
                        <video class="video-preview" controls>
                            <source src="${videoUrl}" type="video/mp4">
                            您的浏览器不支持 Video 标签
                        </video>
                        <a href="${videoUrl}" download class="download-btn">⬇️ 下载 1080P 母带</a>
                    `;
                    statusText = "完成";
                } else if (task.status === 'failed') {
                    mediaContent = `<div class="error-msg" style="margin-top:10px; padding:10px; background:rgba(239,68,68,0.1); border-radius:8px;">❌ 失败: ${task.error || '未知错误'}</div>`;
                    statusText = "失败";
                } else {
                    mediaContent = `
                        <div class="progress-container">
                            <div style="display:flex; justify-content:space-between; font-size:0.8rem; color:#94a3b8; margin-bottom:5px;">
                                <span>渲染中...</span>
                                <span>${task.progress}%</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${task.progress}%"></div>
                            </div>
                        </div>
                    `;
                    statusText = "渲染中";
                }

                return `
                    <div class="task-card">
                        <div class="task-header">
                            <span class="task-id">#${task.id.slice(-6)}</span>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                        </div>
                        
                        <div class="task-meta">
                            <div class="meta-item">⏱️ ${task.duration}s</div>
                            <div class="meta-item">📐 ${task.resolution}</div>
                            ${task.has_image ? '<div class="meta-item">🖼️ 图生视</div>' : ''}
                        </div>

                        <div class="prompt-text" title="${task.prompt}">${task.prompt}</div>
                        ${mediaContent}
                    </div>
                `;
            }).join("");
        }

        setInterval(refresh, 2000);
        refresh();
    </script>
</body>
</html>
